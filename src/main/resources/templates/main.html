<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Grocery Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<!--header-->
<div class="container">
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
        <div class="col-md-3 mb-2 mb-md-0">
            <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
                <img src="../static/images/icon.webp" th:src="@{/images/icon.webp}" width="50px" height="50px" class="rounded-4" alt="icon">
                <h3 class="text-primary">Grocery Shop</h3>
            </a>
        </div>

        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="#" class="nav-link px-2 link-secondary">Home</a></li>
            <li><a href="#" class="nav-link px-2">Features</a></li>
            <li><a href="#" class="nav-link px-2">Cart</a></li>
            <li><a href="#" class="nav-link px-2">Contact</a></li>
            <li><a href="#" class="nav-link px-2">About</a></li>
        </ul>

        <div class="col-md-3 text-end">
            <a href="/login"> <button type="button" class="btn btn-outline-warning me-2">Login</button></a>
            <a href="/signup"><button type="button" class="btn btn-dark">Signup</button></a>
        </div>
    </header>
</div>


<!--hero-->
<div class="container">
    <form class="d-flex col-6 mx-auto my-5" action="/search" method="get" role="search">
        <input class="form-control me-2" type="search" name="query" placeholder="Search" aria-label="Search">
        <button class="btn btn-primary" type="submit">Search</button>
    </form>
</div>
<div class="container">
    <div class="row">
        <div class="col-4" th:each="i:${prods}" >
            <div class="card" style="width: 18rem;">
                <img th:src="@{${i.product_image}} " width="300px" height="300px" class="card-img-top" alt="">
                <div class="card-body">
                    <h5 class="card-title"th:text="${i.productName}"></h5>
                    <p class="card-text"th:text="${i.product_description}"> </p>
                        <a th:href="@{/addtocart/{id}(id=${i.id})}" class="btn btn-primary">Add to cart</a>
                </div>
            </div>
        </div>
    </div>

</div>


<!--footer-->
<div class="container">
    <footer class="py-3 my-4">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
            <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Features</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Pricing</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
        </ul>
        <p class="text-center text-body-secondary">&copy; 2024 Company, Inc</p>
    </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
